<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analyser · Samsung Galaxy S21 Ultra</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;height:100%;background:#202321;color:#c8d1c8;font:12px Arial,sans-serif}
    body{display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden}
    header{width:min(430px,100%);height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;flex:none;font-size:11px}
    button{font:inherit;background:none;color:#fff;border:0;text-decoration:underline;cursor:pointer;padding:5px}
    .device-space{position:relative;flex:none}.device{position:absolute;top:0;left:0;width:430px;height:910px;padding:8px 9px 10px;background:linear-gradient(100deg,#8a8780,#454641 4%,#252824 96%,#9b9992);border-radius:32px;box-shadow:0 10px 24px #0009,inset 0 0 0 1px #b9b5a8;transform:scale(var(--device-scale,1));transform-origin:top left}
    .device:before,.device:after{content:'';position:absolute;right:-2px;width:3px;border-radius:1px;background:#85877e}.device:before{top:180px;height:75px}.device:after{top:290px;height:43px}
    .screen{width:412px;height:892px;overflow:hidden;background:#000;border-radius:24px;display:flex;flex-direction:column;box-shadow:0 0 0 2px #070807}
    .android-status{height:26px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:relative;color:#fff;font:11px Arial,sans-serif}
    .camera-hole{position:absolute;left:50%;top:7px;width:10px;height:10px;border-radius:50%;transform:translateX(-50%);background:#090b0b;box-shadow:0 0 0 1px #272b2b,inset 0 0 0 3px #111617}
    .android-icons{display:flex;align-items:center;gap:5px}.android-icons svg{height:12px;width:17px;fill:#fff}.battery{width:18px;height:9px;border:1px solid #aaa;border-radius:2px;padding:1px}.battery:after{content:'';display:block;background:#eee;width:85%;height:100%}
    iframe{display:block;width:412px;height:842px;flex:none;border:0;background:black}
    .android-nav{height:24px;flex:none;display:grid;place-items:center}.android-nav:after{content:'';width:100px;height:4px;border-radius:4px;background:#e7e9e6}
  </style>
</head>
<body>
  <header><span>Samsung Galaxy S21 Ultra · Analyser</span></header>
  <div class="device-space"><div class="device"><div class="screen">
    <div class="android-status" aria-hidden="true"><span>9:41</span><i class="camera-hole"></i><span class="android-icons"><svg viewBox="0 0 18 14"><path d="M1 13h3V9H1zM6 13h3V6H6zM11 13h3V2h-3z"/></svg><span>85%</span><i class="battery"></i></span></div>
    <iframe title="Analyser on Samsung Galaxy S21 Ultra"></iframe>
    <div class="android-nav" aria-hidden="true"></div>
  </div></div></div>
  <script type="module" src="./phone.js"></script>
</body>
</html>
